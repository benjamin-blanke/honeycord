services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: honeycord
      POSTGRES_USER: honeycord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honeycord -d honeycord"]
      interval: 5s
      timeout: 5s
      retries: 12

  honeycord:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://honeycord:${POSTGRES_PASSWORD}@postgres:5432/honeycord
    depends_on:
      postgres:
        condition: service_healthy
